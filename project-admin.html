<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Private Project Editor</title><link rel="stylesheet" href="css/new-style.css"><link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600&f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body><main class="project-admin"><span class="case-kicker">Private utility / local browser only</span><h1>Edit a case study.</h1><p class="admin-warning">This unlinked editor stores project records in this browser. It is not public authentication. For real private publishing, connect this model to a server with login protection.</p><label>Project<select id="projectSelect"></select></label><form id="projectForm"><div class="admin-form-grid"><label>Title<input name="title" required></label><label>Genre<input name="genre"></label><label>Role<input name="role"></label><label>Engine<input name="engine"></label><label>Duration<input name="duration"></label><label>Platform<input name="platform"></label></div><label>Hero vision<input name="visionLine"></label><label>Vision title<input name="visionTitle"></label><label>The Vision<textarea name="vision" rows="3"></textarea></label><label>Challenge title<input name="challengeTitle"></label><label>Challenge<textarea name="challenge" rows="3"></textarea></label><label>Responsibilities <small>One per line: Title | concise explanation</small><textarea name="responsibilities" rows="6"></textarea></label><label>Design process <small>One per line: Stage | question</small><textarea name="process" rows="5"></textarea></label><label>What Didn't Work<textarea name="failure" rows="3"></textarea></label><label>Playtesting feedback<textarea name="playtesting" rows="3"></textarea></label><label>Production<textarea name="production" rows="3"></textarea></label><label>Lessons learned <small>One lesson per line</small><textarea name="lessons" rows="4"></textarea></label><label>Reflection<textarea name="reflection" rows="3"></textarea></label><div class="admin-actions"><button class="btn btn-primary" type="submit">SAVE PROJECT</button><button class="btn btn-secondary" type="button" id="newProject">NEW PROJECT</button><button class="btn btn-secondary" type="button" id="deleteProject">DELETE RECORD</button></div></form><p id="projectStatus" role="status"></p><a class="case-back-link" href="index.html#projects">Back to website →</a></main>
<script>
const defaults={
 'fps-shooter':{title:'FPS Shooter',genre:'First-Person Shooter',role:'Gameplay Designer',engine:'Unity',duration:'5 months',platform:'PC'},
 'lab-1995':{title:'Lab-1995',genre:'Psychological Horror',role:'Game Designer / Developer',engine:'Unity',duration:'8 months / ongoing',platform:'PC / Steam'},
 'railway-simulator':{title:'Railway Simulator',genre:'Simulation',role:'Level Designer',engine:'Unreal Engine 5',duration:'2.5 months / ongoing',platform:'PC'},
 'the-wrong-floor':{title:'The Wrong Floor',genre:'Anomaly Horror',role:'Solo Game Designer',engine:'Unreal Engine 5',duration:'Under 72 hours',platform:'PC'},
 'fleshbound-curse':{title:'The Fleshbound Curse',genre:'Open World RPG',role:'Game Designer / Developer',engine:'Unity',duration:'8 months',platform:'PC'}
};
const store=()=>JSON.parse(localStorage.getItem('advaitProjects')||'{}'); const save=data=>localStorage.setItem('advaitProjects',JSON.stringify(data)); const select=document.getElementById('projectSelect'); const form=document.getElementById('projectForm'); const status=document.getElementById('projectStatus');
Object.keys(defaults).forEach(id=>select.add(new Option(defaults[id].title,id))); Object.keys(store()).filter(id=>!defaults[id]).forEach(id=>select.add(new Option(store()[id].title||id,id)));
const splitLines=(value)=>value.split('\n').filter(Boolean).map(line=>{const [title,...rest]=line.split('|'); return {title:title.trim(),description:rest.join('|').trim()};});
function load(id){const data={...defaults[id],...(store()[id]||{})}; Object.keys(data).forEach(key=>{const field=form.elements[key]; if(field) field.value=Array.isArray(data[key])?data[key].map(item=>item.title ? `${item.title} | ${item.description}` : item).join('\n'):data[key]||'';});}
select.addEventListener('change',()=>load(select.value)); load(select.value);
form.addEventListener('submit',event=>{event.preventDefault(); const raw=Object.fromEntries(new FormData(form)); const data={...raw,responsibilities:splitLines(raw.responsibilities),process:splitLines(raw.process),lessons:raw.lessons.split('\n').filter(Boolean)}; const all=store(); all[select.value]=data; save(all); status.textContent='Saved locally. Open the matching project page in this browser to preview it.';});
document.getElementById('newProject').addEventListener('click',()=>{const id=prompt('New project id, for example: moonlit-prototype'); if(!id)return; const all=store(); all[id]={title:id}; save(all); const option=new Option(id,id); select.add(option); select.value=id; load(id);});
document.getElementById('deleteProject').addEventListener('click',()=>{const all=store(); delete all[select.value]; save(all); status.textContent='Local record deleted.';});
</script></body></html>
